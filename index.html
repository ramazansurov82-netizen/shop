<!DOCTYPE html><html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Интернет-магазин (WhatsApp заказы)</title>
  <style>
    body { font-family: Arial; margin:0; background:#f2f2f2; }
    h1 { text-align:center; padding:15px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:15px; padding:15px; }
    .card { background:white; padding:10px; border-radius:12px; text-align:center; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
    .card img { width:100%; height:120px; object-fit:cover; border-radius:10px; }
    button { margin-top:10px; padding:8px; border:none; border-radius:8px; cursor:pointer; }
    .add { background:black; color:white; }
    .cart { position:fixed; bottom:0; width:100%; background:white; padding:10px; box-shadow:0 -2px 5px rgba(0,0,0,0.2); }
  </style>
</head>
<body><h1>Магазин</h1><div class="grid" id="products"></div><div class="cart">
  <div id="cartText">Корзина: 0 тг</div>
  <button onclick="sendWhatsApp()" style="background:green;color:white;width:100%;">Заказать в WhatsApp</button>
</div><script>
const phone = "77066004970"; 
const MIN_ORDER = 30000; // минимальный заказ[github.com](https://github.com/ramazansurov62)


const products = [
  {name:"Свечи 8792", price:65, img:"https://via.placeholder.com/150"},
  {name:"Свечи 9759", price:100, img:"https://via.placeholder.com/150"},
  {name:"Свечи 2955", price:45, img:"https://via.placeholder.com/150"},
  {name:"Свечи 1893", price:115, img:"https://via.placeholder.com/150"},
  {name:"Свечи змей", price:130, img:"https://via.placeholder.com/150"},
  {name:"Свечи цифры", price:80, img:"https://via.placeholder.com/150"}
];

let cart = [];

const container = document.getElementById('products');

products.forEach((p, i) => {
  const div = document.createElement('div');
  div.className = 'card';
  div.innerHTML = `
    <img src="${p.img}">
    <h3>${p.name}</h3>
    <p>${p.price} тг</p>
    <button class="add" onclick="addToCart(${i})">Добавить</button>
  `;
  container.appendChild(div);
});

function addToCart(i){
  const item = products[i];
  const existing = cart.find(x => x.name === item.name);

  if(existing){
    existing.qty++;
  } else {
    cart.push({...item, qty:1});
  }

  updateCart();
}

function updateCart(){
  let total = 0;
  cart.forEach(i => total += i.price * i.qty);
  document.getElementById('cartText').innerText = 'Корзина: ' + total + ' тг (мин: 30000)';
}

function sendWhatsApp(){
  const total = cart.reduce((s,i)=>s+i.price*i.qty,0);

  if(total < MIN_ORDER){
    alert('Минимальный заказ 30 000 тг');
    return;
  }

  let text = 'Заказ:%0A';

  cart.forEach(i => {
    text += `${i.name} - ${i.qty} шт = ${i.price * i.qty} тг%0A`;
  });

  text += `%0AИтого: ${total} тг`;

  window.open(`https://wa.me/${phone}?text=${text}`, '_blank');
}
</script></body>
</html>
